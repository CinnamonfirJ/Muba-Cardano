<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URGENT: Delivery Due Soon</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #e53e3e;">URGENT: Delivery Due Soon</h2>
        <p>Hello {{vendor_name}},</p>
        <p><strong>Action Required:</strong> You have an order due for delivery/pickup in less than 4 hours!</p>
        
        <div style="background: #fff5f5; border: 1px solid #fc8181; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <p><strong>Order Ref:</strong> {{ref_id}}</p>
            <p><strong>Item:</strong> {{item_name}}</p>
            <p><strong>Due Date:</strong> {{due_date}}</p>
        </div>

        <p>If you have already dispatched this order, please update the status immediately.</p>
        <p>Team Muba</p>
    </div>
</body>
</html>
